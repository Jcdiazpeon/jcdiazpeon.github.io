<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · jose_diaz.dev</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="/assets/css/site.css">
<script>
  (function () {
    var d = document.documentElement;
    d.className = d.className.replace('no-js', 'js');
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  .lost { min-height: calc(100vh - 67px); display: flex; flex-direction: column; justify-content: center; padding-top: 64px; padding-bottom: 64px; }
  .lost .eyebrow { margin-bottom: 26px; }
  .lost h1 { font-weight: 700; font-size: 58px; line-height: 1.04; letter-spacing: -.03em; margin-bottom: 24px; }
  .term {
    font: 400 13px/1.8 var(--mono); color: var(--text); background: var(--surface);
    border: 1px solid var(--line); padding: 16px 20px; max-width: 620px; margin-bottom: 30px; overflow-wrap: anywhere;
  }
  .term .err { color: var(--amber); }
  @media (max-width: 820px) { .lost h1 { font-size: 36px; } }
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="/">jose_diaz<span>.dev</span></a>
  <nav class="nav-links" aria-label="Sections">
    <a href="/#home">/home</a>
    <a href="/#publications">/publications</a>
    <a href="/#projects">/projects</a>
  </nav>
</header>
<main class="wrap lost">
  <p class="eyebrow accent">ERR — 404 / NOT FOUND</p>
  <h1>Lost the GPS fix.</h1>
  <div class="term">
    $ cd <span id="path">this-page</span><br>
    <span class="err">no such file or directory</span><br>
    $ return-to-home --safe
  </div>
  <div class="btn-row">
    <a href="/">Take me home</a>
    <a href="/#publications">Publications</a>
    <a href="/#projects">Projects</a>
  </div>
</main>
<script>
  var p = location.pathname;
  try { p = decodeURIComponent(p); } catch (e) {}
  document.getElementById('path').textContent = p;
</script>
</body>
</html>
